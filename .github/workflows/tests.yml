name: Windows synthetic tests
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  synthetic:
    runs-on: windows-latest
    timeout-minutes: 20
    env:
      PYTHONUTF8: '1'
      PYTHONDONTWRITEBYTECODE: '1'
      LOCAL_AI_DISABLE_GPU_PROBE: '1'
      LOCAL_AI_UPGRADE_MODE: preserve
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-lock.txt
      - name: Install public dependencies
        run: python -m pip install -r requirements-lock.txt
      - name: Check build command
        run: python scripts/build_release.py --help
      - name: Run synthetic-only regression tests
        run: python -m unittest discover -s tests -v
